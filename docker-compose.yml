# ═══════════════════════════════════════════════════════════
# UPI RADAR — Docker Compose
#
#   docker-compose up -d zookeeper kafka postgres redis   (infra only)
#   docker-compose up --build                              (everything)
#
# DEMO MODE: the api / dashboard / agent containers run fine WITHOUT
# Kafka/Postgres/Redis thanks to built-in fallbacks — infra services
# are then optional. Set DEMO_MODE=false + real .env for production.
# ═══════════════════════════════════════════════════════════
services:
  # ── Kafka dependency ───────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  # ── Kafka broker ───────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  # ── PostgreSQL (historical store) ──────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: upi_radar
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d upi_radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis (real-time bank-health cache + queue) ────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── FastAPI backend ────────────────────────────────────────
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/upi_radar
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres
      - redis
      - kafka
    volumes:
      - .:/app
    restart: unless-stopped

  # ── Streamlit dashboard ────────────────────────────────────
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - RADAR_API_BASE=http://api:8000
    depends_on:
      - api
    volumes:
      - .:/app
    restart: unless-stopped

  # ── Monitor agent (stream consumer + predictor) ────────────
  agent:
    build: .
    command: python -m agent.monitor_agent
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/upi_radar
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
      - postgres
      - redis
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
